<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Mehlika</a>

        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Hakkımda</a>
            <a class="nav-link" href="cv.html">CV</a>
            <a class="nav-link" href="sehir.html">Şehrim</a>
            <a class="nav-link" href="miras.html">Mirasımız</a>
            <a class="nav-link" href="ilgi.html">İlgi Alanlarım</a>
            <a class="nav-link" href="iletisim.html">İletişim</a>
            <a class="nav-link" href="login.html">Login</a>
        </div>
    </div>
</nav>

<main class="container mt-5">

    <section class="mb-4">
        <h1>İletişim</h1>
        <p>Benimle iletişime geçmek için aşağıdaki formu doldurabilirsiniz.</p>
    </section>

    <section class="card-box p-4">
        <form id="iletisimFormu" action="iletisim.php" method="post">

            <div class="mb-3">
                <label class="form-label">Ad Soyad</label>
                <input type="text" id="adSoyad" name="adSoyad" class="form-control" placeholder="Adınızı ve soyadınızı giriniz">
            </div>

            <div class="mb-3">
                <label class="form-label">E-posta</label>
                <input type="text" id="email" name="email" class="form-control" placeholder="ornek@mail.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Telefon</label>
                <input type="text" id="telefon" name="telefon" class="form-control" placeholder="05xxxxxxxxx">
            </div>

            <div class="mb-3">
                <label class="form-label">Konu</label>
                <select id="konu" name="konu" class="form-select">
                    <option value="">Konu seçiniz</option>
                    <option value="Öneri">Öneri</option>
                    <option value="Şikayet">Şikayet</option>
                    <option value="Bilgi">Bilgi</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Cinsiyet</label><br>
                <input type="radio" name="cinsiyet" value="Kadın"> Kadın
                <input type="radio" name="cinsiyet" value="Erkek" class="ms-3"> Erkek
            </div>

            <div class="mb-3">
                <input type="checkbox" id="onay" name="onay" value="Onaylandı">
                <label for="onay">Bilgilerimin gönderilmesini onaylıyorum.</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Mesaj</label>
                <textarea id="mesaj" name="mesaj" class="form-control" rows="4" placeholder="Mesajınızı yazınız"></textarea>
            </div>

            <button type="button" class="btn btn-dark" onclick="jsKontrol()">JavaScript ile Kontrol Et</button>
            <button type="button" class="btn btn-secondary" onclick="htmlKontrol()">HTML5 ile Kontrol Et</button>
            <button type="submit" class="btn btn-success">PHP Sayfasına Gönder</button>
            <button type="reset" class="btn btn-outline-danger">Temizle</button>

        </form>

        <div id="sonuc" class="mt-3"></div>
    </section>

</main>

<script>
function jsKontrol() {
    let adSoyad = document.getElementById("adSoyad").value.trim();
    let email = document.getElementById("email").value.trim();
    let telefon = document.getElementById("telefon").value.trim();
    let konu = document.getElementById("konu").value;
    let mesaj = document.getElementById("mesaj").value.trim();
    let onay = document.getElementById("onay").checked;
    let cinsiyet = document.querySelector('input[name="cinsiyet"]:checked');

    let emailKontrol = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let telefonKontrol = /^[0-9]{11}$/;

    if (adSoyad === "" || email === "" || telefon === "" || konu === "" || mesaj === "") {
        document.getElementById("sonuc").innerHTML = '<div class="alert alert-danger">Lütfen tüm alanları doldurunuz.</div>';
        return;
    }

    if (!emailKontrol.test(email)) {
        document.getElementById("sonuc").innerHTML = '<div class="alert alert-danger">Geçerli bir e-posta adresi giriniz.</div>';
        return;
    }

    if (!telefonKontrol.test(telefon)) {
        document.getElementById("sonuc").innerHTML = '<div class="alert alert-danger">Telefon numarası 11 haneli ve sadece rakamlardan oluşmalıdır.</div>';
        return;
    }

    if (cinsiyet === null) {
        document.getElementById("sonuc").innerHTML = '<div class="alert alert-danger">Lütfen cinsiyet seçiniz.</div>';
        return;
    }

    if (!onay) {
        document.getElementById("sonuc").innerHTML = '<div class="alert alert-danger">Lütfen onay kutusunu işaretleyiniz.</div>';
        return;
    }

    document.getElementById("sonuc").innerHTML =
        '<div class="alert alert-success">Form başarıyla kontrol edildi.</div>';
}

function htmlKontrol() {
    document.getElementById("adSoyad").setAttribute("required", "");
    document.getElementById("email").setAttribute("type", "email");
    document.getElementById("email").setAttribute("required", "");
    document.getElementById("telefon").setAttribute("required", "");
    document.getElementById("telefon").setAttribute("pattern", "[0-9]{11}");
    document.getElementById("konu").setAttribute("required", "");
    document.getElementById("mesaj").setAttribute("required", "");

    if (document.getElementById("iletisimFormu").checkValidity()) {
        document.getElementById("sonuc").innerHTML =
            '<div class="alert alert-success">HTML5 kontrolü başarılı.</div>';
    } else {
        document.getElementById("sonuc").innerHTML =
            '<div class="alert alert-danger">HTML5 kontrolüne göre eksik veya hatalı alan var.</div>';
    }
}

function jqueryKontrol() {

    let adSoyad = $("#adSoyad").val().trim();
    let email = $("#email").val().trim();
    let telefon = $("#telefon").val().trim();

    if (adSoyad.length < 3) {
        $("#sonuc").html(
            '<div class="alert alert-danger">Ad soyad en az 3 karakter olmalıdır.</div>'
        );
        return;
    }

    if (!email.includes("@")) {
        $("#sonuc").html(
            '<div class="alert alert-danger">E-posta adresi hatalı.</div>'
        );
        return;
    }

    if (telefon.length != 11 || isNaN(telefon)) {
        $("#sonuc").html(
            '<div class="alert alert-danger">Telefon numarası sadece rakamlardan oluşmalı ve 11 haneli olmalıdır.</div>'
        );
        return;
    }

    $("#sonuc").html(
        '<div class="alert alert-success">jQuery kontrolü başarılı.</div>'
    );
}

</script>

</body>
</html>
