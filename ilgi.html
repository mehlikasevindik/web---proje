<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>İlgi Alanlarım</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Mehlika</a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Hakkımda</a>
                <a class="nav-link" href="cv.html">CV</a>
                <a class="nav-link" href="sehir.html">Şehrim</a>
                <a class="nav-link" href="miras.html">Mirasımız</a>
                <a class="nav-link active" href="ilgi.html">İlgi Alanlarım</a>
                <a class="nav-link" href="iletisim.html">İletişim</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <!-- İÇERİK -->
    <main class="container mt-5">

        <section class="mb-4">
            <h1>İlgi Alanlarım</h1>
            <p>Film izlemek en sevdiğim aktivitelerden biridir.</p>
        </section>

        <section class="card-box p-4">

            <h2 class="mb-3">Film Ara</h2>

            <input type="text" id="filmInput" class="form-control mb-3" placeholder="Film adı gir..." onkeydown="enterKontrol(event)">

            <button onclick="filmAra()" class="btn btn-dark mb-3">Ara</button>

            <div id="sonuc"></div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script>
function filmAra() {
    let filmAdi = document.getElementById("filmInput").value.trim();

    if (filmAdi === "") {
        document.getElementById("sonuc").innerHTML = "Lütfen bir dizi adı gir.";
        return;
    }

    fetch("https://api.tvmaze.com/search/shows?q=" + encodeURIComponent(filmAdi))
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                let dizi = data[0].show;

                document.getElementById("sonuc").innerHTML = `
                    <div class="card mt-3">
                        <img src="${dizi.image ? dizi.image.medium : ''}" class="card-img-top" alt="${dizi.name}">
                        <div class="card-body">
                            <h5>${dizi.name}</h5>
                            <p>${dizi.summary ? dizi.summary : 'Açıklama bulunamadı.'}</p>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById("sonuc").innerHTML = "Sonuç bulunamadı.";
            }
        });
}

function enterKontrol(event) {
    if (event.key === "Enter") {
        filmAra();
    }
}
</script>

</body>

</html>
