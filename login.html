    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Mehlika</a>

        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Hakkımda</a>

            <a class="nav-link" href="login.html">Login</a>
        </div>
    </div>
</nav>

<main class="container mt-5">

    <section class="mb-4">
        <h1>Login</h1>
        <p>Öğrenci mailiniz ve öğrenci numaranız ile giriş yapabilirsiniz.</p>
    </section>

    <section class="card-box p-4">
        <form action="login.php" method="post" onsubmit="return loginKontrol()">

            <div class="mb-3">
                <label class="form-label">Öğrenci Maili</label>
                <input type="text" id="email" name="email" class="form-control" placeholder="b2412100001@sakarya.edu.tr">
            </div>

            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" id="sifre" name="sifre" class="form-control" placeholder="Öğrenci numaranız">
            </div>

            <button type="submit" class="btn btn-dark">Giriş Yap</button>

            <div id="hata" class="mt-3"></div>

        </form>
    </section>

</main>

<script>
function loginKontrol() {
    let email = document.getElementById("email").value.trim();
    let sifre = document.getElementById("sifre").value.trim();

    if (email === "" || sifre === "") {
        document.getElementById("hata").innerHTML =
            '<div class="alert alert-danger">Mail ve şifre boş bırakılamaz.</div>';
        return false;
    }

    if (!email.endsWith("@sakarya.edu.tr")) {
        document.getElementById("hata").innerHTML =
            '<div class="alert alert-danger">Mail adresi @sakarya.edu.tr ile bitmelidir.</div>';
        return false;
    }

    
    return true;
}
</script>

</body>
</html>
